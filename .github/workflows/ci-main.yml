name: CI Main

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

# 单轨 Gradle CI(M6/WP34 收敛):
# - 旧 Scala/sbt 构建随旧工程于 M6/WP33 删除,本文件不再含 sbt job
# - 前端产物(frontend/dist)不入库,必须先 npm build 再跑 Gradle
#   (copyWebviewDist 校验 frontend/dist 存在,缺失即失败)
jobs:
  gradle:
    runs-on: ubuntu-latest
    name: Gradle (Kotlin)

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle (with dependency caching)
      uses: gradle/actions/setup-gradle@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Build webview frontend
      run: |
        cd frontend
        npm ci
        npm run build

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run quality gates, tests and build plugin
      run: ./gradlew check test buildPlugin

    - name: Upload plugin distribution
      uses: actions/upload-artifact@v4
      with:
        name: codequest-plugin-zip
        path: build/distributions/*.zip
        if-no-files-found: error
