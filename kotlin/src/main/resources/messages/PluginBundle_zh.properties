修改后点「应用」保存,只对之后创建的挑战生效。
settings.templates.editor.label=模板:
settings.templates.restoreDefault=恢复默认文本
settings.templates.help.button=帮助
settings.templates.help.title=模板帮助
settings.templates.help.variables=1、模版变量\n\
${challenge.name} 题目名\n\
${challenge.frontendQuestionId} 前端题号\n\
${challenge.difficulty} 难度\n\
${challenge.codeDojo} 题目所属平台\n\
${challenge.slug} 题目 slug\n\
${challenge.url} 题目链接\n\
${challenge.code} 平台提供的初始代码\n\
${velocity.camelCaseName(...)} 参数转大驼峰(类名/文件名用)\n\
${velocity.smallCamelCaseName(...)} 参数转小驼峰\n\
${velocity.snakeCaseName(...)} 参数转下划线\n\
${velocity.slugify(...)} 参数转 URL slug\n\
${velocity.dateTime()} 生成时间\n\
${beginRegion} / ${endRegion} 提交区域起止标记(见第 2 节)
settings.templates.help.region=2、提交区域标记\n\
请保留 ${beginRegion} 与 ${endRegion} 两行标记——只有标记之间的代码才会被提交到 OJ;\
删除任一标记行都会导致无法提交。
settings.templates.help.filename=3、入口文件名规则\n\
入口文件名默认为 ${velocity.camelCaseName(${challenge.slug})}.<扩展名>,如 two-sum.java。
settings.templates.help.styles=4、风格说明\n\
ACM 竞赛版:stdin/stdout 完整程序骨架(CodeForces/AtCoder/洛谷/HackerRank)。\n\
LeetCode 版:Solution 函数版(力扣中国/力扣国际)。\n\
模板按「风格×语言」独立配置;语言须在对应风格下配置模板后才能在相应平台创建挑战,\
默认语言 Java。
settings.customCss.group=自定义 CSS
settings.customCss.description=可选 CSS,注入题面页;下次加载页面时生效。
settings.customCss.editor.label=CSS:

