settings.databaseFolder.description=<html><body>\
Leave empty to use the default directory <b>{0}</b>.<br>\
All CodeQuest data (problems, submissions, solutions) is stored in the local SQLite database \
(<b>codequest.db</b>) inside this folder. Changing the folder takes effect immediately; \
existing data is not migrated.</body></html>
