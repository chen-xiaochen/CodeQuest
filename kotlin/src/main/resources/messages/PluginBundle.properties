settings.templates.editor.label=Template:
settings.templates.restoreDefault=Restore default text
settings.templates.help.button=Help
settings.templates.help.title=Template help
settings.templates.help.variables=1. Template variables\n\
${challenge.name} - problem title\n\
${challenge.frontendQuestionId} - front-end question id\n\
${challenge.difficulty} - difficulty\n\
${challenge.codeDojo} - platform the problem belongs to\n\
${challenge.slug} - problem slug\n\
${challenge.url} - problem URL\n\
${challenge.code} - starter code provided by the platform\n\
${velocity.camelCaseName(...)} - convert the argument to PascalCase (class / file name)\n\
${velocity.smallCamelCaseName(...)} - convert to camelCase\n\
${velocity.snakeCaseName(...)} - convert to snake_case\n\
${velocity.slugify(...)} - convert to a URL slug\n\
${velocity.dateTime()} - generation timestamp\n\
${beginRegion} / ${endRegion} - submit region markers (see section 2)
settings.templates.help.region=2. Submit region markers\n\
Keep the ${beginRegion} and ${endRegion} marker lines - only the code between them is \
submitted to the online judge. Deleting either marker line breaks submission.
settings.templates.help.filename=3. Entry file name\n\
By default the entry file is named ${velocity.camelCaseName(${challenge.slug})}.<extension>, \
e.g. two-sum.java.
settings.templates.help.styles=4. Styles\n\
ACM contest - stdin/stdout program skeleton (CodeForces / AtCoder / Luogu / HackerRank).\n\
LeetCode - Solution function style (LeetCode China / global).\n\
Templates are configured per style and language. A language becomes usable on the \
matching platform only after its template is configured; Java is the default language.
settings.customCss.group=Custom CSS
settings.customCss.description=Optional CSS injected into the problem statement page. \
Takes effect the next time the page loads.
settings.customCss.editor.label=CSS:

